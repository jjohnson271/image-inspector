<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Inspector</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a64;
    --line: #e3e1da; --accent: #2f5bd3; --accent-soft: #e8eefc;
    --warn: #a2580b; --warn-soft: #fdf1e2; --ok: #2c7a4b;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #1f1f1d; --ink: #ecebe6; --muted: #a09f98;
      --line: #33322f; --accent: #8aa8ff; --accent-soft: #232b40;
      --warn: #f0b070; --warn-soft: #3a2a17; --ok: #7fd1a0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 20px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  .tag {
    font: 12px var(--mono); color: var(--muted); border: 1px solid var(--line);
    padding: 2px 8px; border-radius: 99px;
  }
  .tag.ready { color: var(--ok); border-color: currentColor; }
  .lede { color: var(--muted); margin: 0 0 20px; max-width: 70ch; }

  #drop {
    border: 2px dashed var(--line); border-radius: 14px; background: var(--card);
    padding: 36px 20px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop:focus-visible, #drop.over { border-color: var(--accent); background: var(--accent-soft); outline: none; }
  #drop strong { display: block; font-size: 18px; margin-bottom: 4px; }
  #drop span { color: var(--muted); font-size: 14px; }
  #file { display: none; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 20px 0 12px; }
  .toolbar .count { margin-right: auto; color: var(--muted); }
  button {
    font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; border-color: var(--line); }

  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; vertical-align: top; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--bg); }
  td .main { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td .sub { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  td .warn { color: var(--warn); background: var(--warn-soft); font-size: 12.5px; padding: 3px 8px; border-radius: 6px; display: inline-block; margin-top: 4px; }
  .thumb {
    width: 84px; height: 64px; border-radius: 8px; object-fit: cover; display: block;
    background: repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 50% / 12px 12px;
  }
  .nothumb { width: 84px; height: 64px; border-radius: 8px; border: 1px dashed var(--line);
    display: grid; place-items: center; text-align: center; font-size: 11px; color: var(--muted); padding: 4px; }
  .name { word-break: break-all; font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 28px; }

  details.help { margin-top: 28px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 18px; }
  details.help summary { cursor: pointer; font-weight: 600; padding: 12px 0; }
  details.help dl { margin: 0 0 16px; }
  details.help dt { font-weight: 600; margin-top: 12px; }
  details.help dd { margin: 2px 0 0; color: var(--muted); max-width: 80ch; }
  details.help pre { font: 12px/1.45 var(--mono); background: var(--bg); padding: 14px; border-radius: 8px; overflow: auto; max-height: 420px; }

  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .item { display: flex; gap: 14px; align-items: flex-start; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .item .name { font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 400; }
  .item .info { font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; min-width: 0; }
  .item { position: relative; }
  .item .info { padding-right: 28px; white-space: nowrap; }
  .copy { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; padding: 0;
    display: grid; place-items: center; border-radius: 7px; border: 1px solid transparent;
    background: transparent; color: var(--muted); }
  .copy:hover, .copy:focus-visible { border-color: var(--line); color: var(--ink); background: var(--bg); }
  .copy.done { color: var(--ok); }
  .copy svg { width: 16px; height: 16px; }
  .item .thumb, .item .nothumb { width: 64px; height: 64px; flex: none; }
  .list .empty { grid-column: 1 / -1; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Image Inspector</h1>
  </header>
  <p class="lede">Upload one or more images to see their file type, resolution, DPI and bit depth.</p>

  <div id="drop" tabindex="0" role="button" aria-label="Choose images to upload">
    <strong>Drop images here or click to choose</strong>
    <span>PNG · JPEG · GIF · BMP · WebP · TIFF · AVIF · HEIC, and you can select several at once</span>
  </div>
  <input type="file" id="file" multiple accept="image/*,.heic,.heif,.avif,.tif,.tiff">

  <div class="toolbar">
    <span class="count" id="count">No images yet</span>
    <button id="clear" disabled>Clear</button>
  </div>

  <div class="list" id="rows"><div class="empty">Your images will appear here.</div></div>


</main>

const FORMATS = ["Unknown", "PNG", "JPEG", "GIF", "BMP", "WebP", "TIFF", "AVIF", "HEIC"];
const EXTS = { PNG:["png"], JPEG:["jpg","jpeg","jpe","jfif"], GIF:["gif"], BMP:["bmp","dib"],
  WebP:["webp"], TIFF:["tif","tiff"], AVIF:["avif"], HEIC:["heic","heif"] };
const TYPE_LABEL = { PNG:".png", JPEG:".jpg", GIF:".gif", BMP:".bmp", WebP:".webp", TIFF:".tiff", AVIF:".avif", HEIC:".heic" };
const DPI_SRC =["", "PNG pHYs chunk", "JFIF header", "EXIF metadata", "BMP header", "TIFF tags"];
const COMP = ["", "lossless", "lossy", "uncompressed"];

let wasm = null;
const results = [];
const urls = [];

async function initWasm() {
  const bytes = Uint8Array.from(atob(WASM_B64), c => c.charCodeAt(0));
  const { instance } = await WebAssembly.instantiate(bytes, {});
  wasm = instance.exports;
}

function analyse(bytes) {
  const mem = wasm.memory, ptr = wasm.input_ptr();
  const need = ptr + bytes.length - mem.buffer.byteLength;
  if (need > 0) mem.grow(Math.ceil(need / 65536));
  new Uint8Array(mem.buffer, ptr, bytes.length).set(bytes);
  wasm.parse(bytes.length);
  const r = new Int32Array(mem.buffer, wasm.result_ptr(), 12);
  return {
    format: FORMATS[r[0]] || "Unknown", width: r[1] >>> 0, height: r[2] >>> 0,
    bpc: r[3], channels: r[4], bpp: r[5],
    dpiX: r[6] / 100, dpiY: r[7] / 100, dpiSource: DPI_SRC[r[8]] || "",
    model: r[9], alpha: !!r[10], compression: COMP[r[11]] || ""
  };
}

/* ---------- formatting helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const num = n => n.toLocaleString("en-GB");
const round1 = n => Math.round(n * 10) / 10;
function bytes(n) {
  if (n < 1024) return n + " B";
  const u = ["KB", "MB", "GB", "TB"]; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.round(n)) + " " + u[i];
}
function modelName(info) {
  const a = info.alpha;
  switch (info.model) {
    case 1: return a ? "greyscale + alpha" : "greyscale";
    case 2: return a ? "RGBA" : "RGB";
    case 3: return a ? "indexed palette + transparency" : "indexed palette";
    case 4: return "CMYK";
    default: return "";
  }
}
function colourCount(info) {
  let bits;
  if (info.model === 3) bits = info.bpp;
  else if (info.model === 4) return "";
  else bits = info.bpc * (info.channels - (info.alpha ? 1 : 0));
  if (!bits) return "";
  if (bits > 53) return "2^" + bits + " colours";
  const n = 2 ** bits;
  if (info.model === 3) return "palette of up to " + num(n) + " colours";
  return num(n) + " colours";
}

/* ---------- describe one result for display ---------- */
function describe(file, info) {
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  const out = { file, info, ext };

  // File type
  out.typeMain = info.format === "Unknown" ? "Not recognised" : TYPE_LABEL[info.format];
  out.typeSub = [ext ? "." + ext : "", bytes(file.size), info.compression].filter(Boolean).join(" · ");
  if (info.format !== "Unknown" && ext && EXTS[info.format] && !EXTS[info.format].includes(ext))
    out.typeWarn = `The extension says .${ext} but the bytes are ${info.format}`;

  // Resolution
  if (info.width && info.height) {
    const mp = info.width * info.height / 1e6;
    out.resMain = `${info.width} x ${info.height} pixels`;
    out.resSub = `${mp >= 0.1 ? mp.toFixed(1) : mp.toFixed(2)} megapixels`;
  } else { out.resMain = "—"; out.resSub = ""; }

  // DPI
  if (info.dpiX > 0) {
    const x = round1(info.dpiX), y = round1(info.dpiY);
    out.dpiMain = x === y ? `${x} DPI` : `${x} × ${y} DPI`;
    const wi = info.width / info.dpiX, hi = info.height / info.dpiY;
    out.dpiSub = `from ${info.dpiSource}`;
    if (info.width) out.dpiSub += `<br>prints at ${(wi * 2.54).toFixed(1)} × ${(hi * 2.54).toFixed(1)} cm (${wi.toFixed(1)} × ${hi.toFixed(1)} in)`;
  } else if (info.format !== "Unknown") {
    out.dpiMain = "72 DPI";
    out.dpiSub = info.format === "GIF" || info.format === "AVIF" || info.format === "WebP"
      ? `${info.format} files don’t usually store DPI, so software assumes 72 or 96`
      : "Software will usually assume 72 or 96";
  } else { out.dpiMain = "—"; out.dpiSub = ""; }

  // Bit depth
  if (info.bpp) {
    out.bitMain = `${info.bpp}-bit`;
    const parts = [];
    if (info.model === 3) parts.push(`${info.bpp} bits per pixel index`);
    else {
      let s = `${info.bpc} bits × ${info.channels} channel${info.channels > 1 ? "s" : ""}`;
      const pad = info.bpp - info.bpc * info.channels;
      if (pad > 0) s += ` + ${pad} unused`;
      parts.push(s);
    }
    const m = modelName(info); if (m) parts[0] += ` (${m})`;
    const c = colourCount(info); if (c) parts.push(c);
    out.bitSub = parts.join("<br>");
    if (info.width && info.height) {
      const raw = info.width * info.height * info.bpp / 8;
      out.rawSize = raw;
      out.bitSub += `<br>uncompressed ${bytes(raw)}`;
      if (file.size < raw) out.bitSub += ` · ${Math.round((1 - file.size / raw) * 100)}% smaller on disk`;
    }
  } else { out.bitMain = "—"; out.bitSub = ""; }

  return out;
}

const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const ICON_TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

function copyText(d) {
  return [d.typeMain, d.resMain, d.dpiMain, d.bitMain].join("\n");
}

async function copyToClipboard(text) {
  try { await navigator.clipboard.writeText(text); return; } catch (e) {}
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
}

function rowHTML(d, idx) {
  const thumb = `<img class="thumb" src="${urls[idx]}" alt="" loading="lazy"
    onerror="this.outerHTML='<div class=nothumb>No preview</div>'">`;
  return `<div class="item">
    <button class="copy" data-idx="${idx}" title="Copy to clipboard" aria-label="Copy details for ${esc(d.file.name)}">${ICON_COPY}</button>
    ${thumb}<div class="info">
    <div class="name">${esc(d.file.name)}</div>
    ${esc(d.typeMain)}<br>${d.resMain}<br>${d.dpiMain}<br>${d.bitMain}</div></div>`;
}

function render() {
  const tbody = document.getElementById("rows");
  tbody.innerHTML = results.length
    ? results.map(rowHTML).join("")
    : `<div class="empty">Your images will appear here.</div>`;
  document.getElementById("count").textContent =
    results.length ? `${results.length} image${results.length > 1 ? "s" : ""}` : "No images yet";
  document.getElementById("clear").disabled = !results.length;
}

async function handleFiles(list) {
  if (!wasm) await ready;
  for (const file of list) {
    const buf = new Uint8Array(await file.arrayBuffer());
    const info = analyse(buf);
    urls.push(URL.createObjectURL(file));
    results.push(describe(file, info));
    render();
  }
}


/* ---------- wiring ---------- */
const ready = initWasm().catch(err => {
  document.getElementById("count").textContent = "Sorry, this browser couldn’t load the image reader."; console.error(err);
});
const drop = document.getElementById("drop"), input = document.getElementById("file");
drop.addEventListener("click", () => input.click());
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
input.addEventListener("change", () => { handleFiles([...input.files]); input.value = ""; });
["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => handleFiles([...e.dataTransfer.files]));
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => e.preventDefault());
document.getElementById("rows").addEventListener("click", async e => {
  const btn = e.target.closest(".copy"); if (!btn) return;
  await copyToClipboard(copyText(results[+btn.dataset.idx]));
  btn.innerHTML = ICON_TICK; btn.classList.add("done"); btn.title = "Copied";
  setTimeout(() => { btn.innerHTML = ICON_COPY; btn.classList.remove("done"); btn.title = "Copy to clipboard"; }, 1500);
});
document.getElementById("clear").addEventListener("click", () => {
  urls.forEach(u => URL.revokeObjectURL(u)); urls.length = 0; results.length = 0; render();
});
</script>
