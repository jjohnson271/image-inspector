<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Inspector</title>
<style>
:root{color-scheme:light dark;--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--muted:#6b6a64;--line:#e3e1da;--accent:#2f5bd3}@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--ink:#ecebe6;--muted:#a09f98;--line:#33322f;--accent:#8aa8ff}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:32px 20px 64px}h1{font-size:28px;margin:0 0 8px}.lede{color:var(--muted);margin:0 0 20px}#drop{border:2px dashed var(--line);border-radius:14px;background:var(--card);padding:36px 20px;text-align:center;cursor:pointer}#drop:hover,#drop:focus-visible,#drop.over{border-color:var(--accent);outline:none}#drop strong{display:block;font-size:18px}#drop span{color:var(--muted);font-size:14px}#file{display:none}.toolbar{display:flex;gap:10px;align-items:center;margin:20px 0 12px}.count{margin-right:auto;color:var(--muted)}button{font:inherit;font-size:14px;padding:7px 14px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}button:disabled{opacity:.45;cursor:default}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.item,.empty{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.item{display:flex;gap:14px;align-items:flex-start}.thumb,.nothumb{width:64px;height:64px;flex:none;border-radius:8px;object-fit:cover;background:var(--bg)}.nothumb{display:grid;place-items:center;color:var(--muted);font-size:11px;border:1px dashed var(--line)}.info{min-width:0}.name{font-size:13px;color:var(--muted);word-break:break-all;margin-bottom:4px}.empty{text-align:center;color:var(--muted);grid-column:1/-1}
</style>
</head>
<body><main>
<h1>Image Inspector</h1>
<p class="lede">Choose one or more images to inspect their file type, resolution, and size. Image processing happens locally in your browser.</p>
<div id="drop" tabindex="0" role="button" aria-label="Choose images to upload"><strong>Drop images here or click to choose</strong><span>PNG · JPEG · GIF · BMP · WebP · TIFF · AVIF · HEIC</span></div>
<input type="file" id="file" multiple accept="image/*,.heic,.heif,.avif,.tif,.tiff">
<div class="toolbar"><span class="count" id="count">No images yet</span><button id="csv" disabled>Download CSV</button><button id="clear" disabled>Clear</button></div>
<div class="list" id="rows"><div class="empty">Your images will appear here.</div></div>
</main>
<script>
const files=[];const urls=[];const $=id=>document.getElementById(id);const size=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';
function render(){ $('count').textContent=files.length?`${files.length} image${files.length===1?'':'s'}`:'No images yet';$('csv').disabled=$('clear').disabled=!files.length;$('rows').innerHTML=files.length?files.map((f,i)=>`<article class="item"><img class="thumb" src="${urls[i]}" alt=""><div class="info"><div class="name"></div><b>${f.type||'Unidentified image'}</b><br>${f.width&&f.height?`${f.width.toLocaleString()} × ${f.height.toLocaleString()} pixels`: 'Dimensions unavailable in this browser'}<br>${size(f.file.size)}<br>DPI and bit depth are not exposed by the browser's image decoder.</div></article>`).join(''):'<div class="empty">Your images will appear here.</div>';document.querySelectorAll('.name').forEach((el,i)=>el.textContent=files[i].file.name)}
async function add(list){for(const file of list){const url=URL.createObjectURL(file);urls.push(url);const entry={file,width:0,height:0};try{const image=new Image();image.src=url;await image.decode();entry.width=image.naturalWidth;entry.height=image.naturalHeight}catch{}files.push(entry);render()}}
const drop=$('drop'),input=$('file');drop.addEventListener('click',()=>input.click());drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}});input.addEventListener('change',()=>{add(input.files);input.value=''});for(const t of ['dragenter','dragover'])drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')});for(const t of ['dragleave','drop'])drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')});drop.addEventListener('drop',e=>add(e.dataTransfer.files));document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>e.preventDefault());$('clear').addEventListener('click',()=>{urls.forEach(URL.revokeObjectURL);urls.length=files.length=0;render()});$('csv').addEventListener('click',()=>{const q=v=>{v=String(v??'');return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};const lines=[['File name','Detected type','File size (bytes)','Width (px)','Height (px)'].join(','),...files.map(x=>[x.file.name,x.file.type,x.file.size,x.width||'',x.height||''].map(q).join(','))];const url=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='image-details.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
</script></body></html>
